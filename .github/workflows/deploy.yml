name: Deploy note.daiyongkim.com

# 정적 파일 그대로 배포한다. 빌드 단계가 없다 — 이 사이트의 요점이
# "설치할 게 없다" 인데 배포에 툴체인을 끼우면 앞뒤가 안 맞는다.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
